<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کلمه‌ی بعدی چیست؟ | جزء سی‌ام</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ead7;--paper2:#eadfc4;--ink:#1d2b2a;--soft:#5b6b66;--emerald:#1f6f5c;--clay:#b8532f;--gold:#c59a3a;--card:#fffaf0;--line:#d8c9a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10201f;--paper2:#16292a;--ink:#f1e8d2;--soft:#9db1aa;--emerald:#47b79a;--clay:#e27d57;--gold:#e0b64f;--card:#1b3132;--line:#2f4a47}}
:root[data-theme="dark"]{--paper:#10201f;--paper2:#16292a;--ink:#f1e8d2;--soft:#9db1aa;--emerald:#47b79a;--clay:#e27d57;--gold:#e0b64f;--card:#1b3132;--line:#2f4a47}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;
background-image:repeating-linear-gradient(45deg,transparent 0 38px,rgba(197,154,58,.10) 38px 39px),repeating-linear-gradient(-45deg,transparent 0 38px,rgba(197,154,58,.10) 38px 39px)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:22px 0 14px;border-bottom:2px solid var(--gold)}
.top{display:flex;gap:14px;align-items:center}
.seal{width:54px;height:54px;position:relative;flex:none;animation:spin 40s linear infinite}
.seal i{position:absolute;inset:8px;border:3px solid var(--gold);background:var(--paper)}
.seal i:nth-child(2){transform:rotate(45deg);border-color:var(--emerald)}
.seal b{position:absolute;inset:20px;background:var(--clay);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.seal{animation:none}*{animation:none!important}}
h1{margin:0;font-family:Amiri,serif;font-size:clamp(26px,6vw,38px);line-height:1.2}
.by{margin:4px 0 0;color:var(--soft);font-size:13px;line-height:1.9}
.by strong{color:var(--emerald)}
.by a{color:var(--clay);text-decoration:none;font-weight:600}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0 10px}
select{font:inherit;font-family:Amiri,serif;font-size:19px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font-size:14px;color:var(--soft)}
.score b{color:var(--emerald);font-size:17px}
.prog{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--emerald));transition:width .3s}
.arch{background:var(--card);border:3px solid var(--gold);border-radius:50% 50% 18px 18px/34% 34% 18px 18px;padding:46px 22px 24px;text-align:center;box-shadow:inset 0 0 0 7px var(--card),inset 0 0 0 9px var(--line),0 10px 0 -4px var(--paper2)}
.ref{font-size:13px;color:var(--soft);margin-bottom:10px}
.verse{font-family:Amiri,serif;font-size:clamp(26px,7vw,38px);line-height:2.1}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px dashed var(--gold);margin:0 4px;color:var(--emerald);font-weight:700;vertical-align:bottom}
.gap.ok{border-bottom:3px solid var(--emerald)}
.gap.no{border-bottom:3px solid var(--clay);color:var(--clay)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{font-family:Amiri,serif;font-size:clamp(22px,5.5vw,28px);padding:12px 8px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--emerald);transform:translateY(-2px)}
.opt.ok{background:var(--emerald);border-color:var(--emerald);color:#fff}
.opt.no{background:var(--clay);border-color:var(--clay);color:#fff;animation:sh .4s}
.opt:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.act{display:block;margin:16px auto 0;font:inherit;font-weight:600;padding:11px 28px;border-radius:12px;border:2px solid var(--emerald);background:var(--emerald);color:#fff;cursor:pointer}
.msg{min-height:24px;text-align:center;margin-top:12px;font-size:15px}
.end{text-align:center}
.end .st{font-size:38px;color:var(--gold);letter-spacing:6px}
footer{margin-top:28px;padding:18px 0 28px;border-top:2px solid var(--gold);text-align:center;font-size:14px;color:var(--soft);line-height:2}
footer strong{color:var(--ink)}footer a{color:var(--clay);text-decoration:none;font-weight:600}
.rest{color:var(--soft)}
</style>
</head>

</div>

<script>
const S=[
{n:"الإخلاص",fa:"اخلاص",v:["قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ"]},
{n:"الفلق",fa:"فلق",v:["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"]},
{n:"الناس",fa:"ناس",v:["قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","إِلَٰهِ النَّاسِ","مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"]},
{n:"الكوثر",fa:"کوثر",v:["إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ","إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"]},
{n:"العصر",fa:"عصر",v:["وَالْعَصْرِ","إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"]},
{n:"النصر",fa:"نصر",v:["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا"]},
{n:"قريش",fa:"قریش",v:["لِإِيلَافِ قُرَيْشٍ","إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ"]},
{n:"الفيل",fa:"فیل",v:["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ"]},
{n:"المسد",fa:"مسد",v:["تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ","مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ","سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ"]},
{n:"الكافرون",fa:"کافرون",v:["قُلْ يَا أَيُّهَا الْكَافِرُونَ","لَا أَعْبُدُ مَا تَعْبُدُونَ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","لَكُمْ دِينُكُمْ وَلِيَ دِينِ"]},
{n:"الماعون",fa:"ماعون",v:["أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","فَوَيْلٌ لِّلْمُصَلِّينَ","الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","الَّذِينَ هُمْ يُرَاءُونَ","وَيَمْنَعُونَ الْمَاعُونَ"]},
{n:"التكاثر",fa:"تکاثر",v:["أَلْهَاكُمُ التَّكَاثُرُ","حَتَّىٰ زُرْتُمُ الْمَقَابِرَ","كَلَّا سَوْفَ تَعْلَمُونَ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ","لَتَرَوُنَّ الْجَحِيمَ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ","ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ"]},
{n:"الهمزة",fa:"همزه",v:["وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ","الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ","يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ","كَلَّا لَيُنبَذَنَّ فِي الْحُطَمَةِ","وَمَا أَدْرَاكَ مَا الْحُطَمَةُ","نَارُ اللَّهِ الْمُوقَدَةُ","الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ","إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ","فِي عَمَدٍ مُّمَدَّدَةٍ"]},
{n:"الزلزلة",fa:"زلزله",v:["إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","وَقَالَ الْإِنسَانُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ","فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ"]},
{n:"الضحى",fa:"ضحی",v:["وَالضُّحَىٰ","وَاللَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","وَوَجَدَكَ ضَالًّا فَهَدَىٰ","وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"]},
{n:"الشرح",fa:"شرح",v:["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","الَّذِي أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَ","فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","إِنَّ مَعَ الْعُسْرِ يُسْرًا","فَإِذَا فَرَغْتَ فَانصَبْ","وَإِلَىٰ رَبِّكَ فَارْغَب"]},
{n:"التين",fa:"تین",v:["وَالتِّينِ وَالزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَٰذَا الْبَلَدِ الْأَمِينِ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ","ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ","أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ"]},
{n:"القارعة",fa:"قارعه",v:["الْقَارِعَةُ","مَا الْقَارِعَةُ","وَمَا أَدْرَاكَ مَا الْقَارِعَةُ","يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ","وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ","فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ","فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ","وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ","فَأُمُّهُ هَاوِيَةٌ","وَمَا أَدْرَاكَ مَا هِيَهْ","نَارٌ حَامِيَةٌ"]},
];
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const strip=w=>w.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let best=0;try{best=+localStorage.getItem("next-best")||0}catch(e){}
let Q=[],qi=0,k=0,score=0,total=0,wrong=false,locked=false;

$("sel").innerHTML='<option value="-1">همه‌ی سوره‌ها ('+fa(S.length)+')</option>'+S.map((s,i)=>`<option value="${i}">سوره‌ی ${s.fa}</option>`).join("");
$("sel").onchange=start;$("mode").onchange=start;

function start(){
 const f=+$("sel").value,full=$("mode").value==="full",pool=[];
 S.forEach((s,si)=>{if(f>=0&&f!==si)return;s.v.forEach((t,vi)=>{const w=t.split(" ");if(w.length>=3)pool.push({si,vi,w})})});
 Q=shuf(pool).slice(0,full?5:10).map(q=>{const k0=full?1:1+Math.floor(Math.random()*(q.w.length-1));return{...q,k0,end:full?q.w.length:k0+1}});
 total=Q.reduce((a,q)=>a+q.end-q.k0,0);qi=0;score=0;
 $("sc").textContent=fa(0);$("qt").textContent=fa(Q.length);begin()}

function begin(){k=Q[qi].k0;$("qn").textContent=fa(qi+1);step()}

function step(){
 const q=Q[qi],ans=q.w[k];wrong=false;locked=false;
 const same=S[q.si].v.join(" ").split(" "),all=S.flatMap(s=>s.v.join(" ").split(" "));
 const seen=new Set([strip(ans)]),d=[];
 for(const w of [...shuf(same),...shuf(all)]){const x=strip(w);if(x.length>=2&&!seen.has(x)){seen.add(x);d.push(w);if(d.length===3)break}}
 const opts=shuf([ans,...d]);
 $("pg").style.width=((qi+(k-q.k0)/(q.end-q.k0))/Q.length*100)+"%";
 $("main").innerHTML=`<div class="arch"><div class="ref">سوره‌ی ${S[q.si].fa} · آیه‌ی ${fa(q.vi+1)}</div>
 <div class="verse">${q.w.slice(0,k).join(" ")} <span class="gap" id="gap">&nbsp;</span><span class="rest" id="rest"></span></div></div>
 <div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div>
 <div class="msg" id="msg">کلمه‌ی بعدی کدام است؟</div><div id="nx"></div>`}

$("main").addEventListener("click",e=>{
 const b=e.target.closest(".opt");
 if(b&&!locked&&!b.disabled){
  const q=Q[qi],ans=q.w[k],g=$("gap");
  if(b.textContent!==ans){wrong=true;b.classList.add("no");b.disabled=true;$("msg").textContent="دوباره فکر کن، آیه را در ذهنت بخوان.";return}
  locked=true;if(!wrong){score++;$("sc").textContent=fa(score)}
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add("ok")});
  g.textContent=ans;g.classList.add("ok");k++;
  if(k<q.end){$("msg").textContent="درست بود ✓";setTimeout(step,650)}
  else{$("rest").textContent=" "+q.w.slice(k).join(" ");$("pg").style.width=((qi+1)/Q.length*100)+"%";
   $("msg").textContent="أَحْسَنْتَ! ✓";$("nx").innerHTML=`<button class="act" id="go">${qi+1<Q.length?"آیه‌ی بعدی ←":"پایان دور"}</button>`}
  return}
 if(e.target.id==="go"){qi++;qi<Q.length?begin():end()}
 if(e.target.id==="again")start()});

function end(){
 const r=score/total,s=r>=.9?3:r>=.6?2:1;
 if(score>best){best=score;try{localStorage.setItem("next-best",best)}catch(e){}}
 $("main").innerHTML=`<div class="arch end"><div class="st">${"★".repeat(s)+"☆".repeat(3-s)}</div><h2 style="font-family:Amiri,serif;font-size:30px;margin:6px 0">بَارَكَ اللَّهُ فِيكَ</h2>
 <p>${fa(score)} کلمه‌ی درست از ${fa(total)} در اولین تلاش<br>بهترین نتیجه‌ات: ${fa(best)}</p><button class="act" id="again">دور تازه</button></div>`}
start();
</script>
</body>
</html>
