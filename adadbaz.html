function start(L){S={L,i:0,sc:0,lv:3,st:0,ok:0,seen:new Set(),bag:[],miss:[],h:1,tm:1};$('#h').disabled=$('#tm').disabled=false;show('g');next()}
function hud(){$('#sc').textContent=fa(S.sc);$('#st').textContent=fa(S.st);$('#pg').textContent=`${fa(S.i)} از ۱۲`;$('#lv').textContent='♥'.repeat(S.lv)+'♡'.repeat(3-S.lv)}
function next(){if(S.i>=12||S.lv<1)return end();S.i++;let x;for(let k=0;k<40;k++){if(!S.bag.length)S.bag=sh(G.filter(g=>S.L!=5||g[0]==5));x=S.bag.pop()[1](S.L||P([5,6]));if(!S.seen.has(x.q))break}S.seen.add(x.q);
const o=sh([...new Set([x.a,...sh(x.d)])].slice(0,4)),t=S.L==6?30:25;S.c={x,o,ci:o.indexOf(x.a),done:0,t,tt:t};
$('#q').innerHTML=x.q;$('#o').innerHTML=o.map((v,i)=>`<button class="btn opt" onclick="ans(${i})">${v}</button>`).join('');$('#msg').textContent='';hud();clearInterval(T);T=setInterval(()=>{S.c.t-=.1;$('#bar').style.width=Math.max(0,S.c.t/S.c.tt*100)+'%';if(S.c.t<=0)ans(-1)},100)}
function ans(i){const c=S.c;if(c.done)return;c.done=1;clearInterval(T);const r=i==c.ci;document.querySelectorAll('#o .opt').forEach((e,k)=>{e.disabled=true;if(k==c.ci)e.classList.add('ok');else if(k==i)e.classList.add('no')});
if(r){S.st++;S.ok++;const p=10+Math.ceil(c.t)+Math.min(S.st,5)*2;S.sc+=p;$('#msg').textContent=`${P(['آفرین!','عالی!','درسته!','دمت گرم!','حرف نداشت!'])}  +${fa(p)}`}
else{S.lv--;S.st=0;S.miss.push({q:c.x.q,a:c.x.a});$('#msg').textContent=i<0?'زمان تمام شد! جواب درست سبز شد.':'نشد! جواب درست سبز شد.';$('#c').classList.add('shake')}
hud();setTimeout(()=>{$('#c').classList.remove('shake');next()},r?1000:2000)}
function half(){if(!S.h||S.c.done)return;S.h=0;$('#h').disabled=true;const b=[...document.querySelectorAll('#o .opt')];let n=Math.min(2,b.length-2);sh(b.map((_,k)=>k)).forEach(k=>{if(k!=S.c.ci&&n>0){b[k].classList.add('off');n--}})}
function addT(){if(!S.tm||S.c.done)return;S.tm=0;S.c.t+=10;S.c.tt+=10;$('#tm').disabled=true}
function end(){clearInterval(T);show('e');const a=S.ok;$('#rt').textContent=S.lv<1?'جان‌هات تموم شد':a>=11?'استاد ریاضی':a>=8?'ریاضی‌دان':a>=5?'در حال پیشرفت':'تمرین کن، می‌شه!';$('#rs').textContent=fa(S.sc);$('#ra').textContent=`${fa(a)} پاسخ درست از ${fa(S.i)} سؤال`;
let b=0;try{b=+localStorage.getItem('ab')||0;if(S.sc>b){localStorage.setItem('ab',S.sc);$('#rb').textContent='رکورد جدید!';b=S.sc}else $('#rb').textContent=`رکورد: ${fa(b)}`}catch(e){}
$('#ms').innerHTML=S.miss.length?'<h3>مرور اشتباه‌ها</h3>'+S.miss.map(m=>`<div class="mi"><div>${m.q}</div><b>${m.a}</b></div>`).join(''):'<h3>بدون هیچ اشتباهی!</h3>'}
document.addEventListener('keydown',e=>{if($('#g').classList.contains('on')&&S.c&&/^[1-4]$/.test(e.key)&&S.c.o[e.key-1]!==undefined)ans(e.key-1)});
bestTxt();
</script></body></html>
